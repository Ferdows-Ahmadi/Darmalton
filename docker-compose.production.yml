name: ${COMPOSE_PROJECT_NAME:-darmalton}

services:
  db:
    image: postgres:17.6-alpine
    environment:
      POSTGRES_DB: ${POSTGRES_DB:?POSTGRES_DB is required}
      POSTGRES_USER: ${POSTGRES_USER:?POSTGRES_USER is required}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?POSTGRES_PASSWORD is required}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $$POSTGRES_USER -d $$POSTGRES_DB"]
      interval: 10s
      timeout: 5s
      retries: 12
    restart: unless-stopped
    networks: [data]
    security_opt: ["no-new-privileges:true"]

  backend:
    image: ${DARMALTON_BACKEND_IMAGE:-darmalton-backend-production:local}
    build:
      context: ./backend
      dockerfile: ../infrastructure/backend.production.Dockerfile
    environment:
      DATABASE_URL: ${DATABASE_URL:?DATABASE_URL is required}
      DATABASE_CONN_MAX_AGE: ${DATABASE_CONN_MAX_AGE:-60}
      DJANGO_PRODUCTION: "true"
      DJANGO_DEBUG: "false"
      DJANGO_USE_SQLITE: "false"
      DJANGO_SECRET_KEY: ${DJANGO_SECRET_KEY:?DJANGO_SECRET_KEY is required}
      DJANGO_ALLOWED_HOSTS: ${DJANGO_ALLOWED_HOSTS:?DJANGO_ALLOWED_HOSTS is required},backend
      DJANGO_CORS_ALLOWED_ORIGINS: ${DJANGO_CORS_ALLOWED_ORIGINS:?DJANGO_CORS_ALLOWED_ORIGINS is required}
      DJANGO_CSRF_TRUSTED_ORIGINS: ${DJANGO_CSRF_TRUSTED_ORIGINS:?DJANGO_CSRF_TRUSTED_ORIGINS is required}
      DJANGO_SECURE_HSTS_SECONDS: ${DJANGO_SECURE_HSTS_SECONDS:-31536000}
      DJANGO_ANON_THROTTLE_RATE: ${DJANGO_ANON_THROTTLE_RATE:-120/min}
      DJANGO_USER_THROTTLE_RATE: ${DJANGO_USER_THROTTLE_RATE:-600/min}
      DJANGO_LOG_LEVEL: ${DJANGO_LOG_LEVEL:-INFO}
      ACCESS_TOKEN_MINUTES: ${ACCESS_TOKEN_MINUTES:-15}
      REFRESH_TOKEN_DAYS: ${REFRESH_TOKEN_DAYS:-7}
      PRESCRIPTION_MAX_UPLOAD_BYTES: ${PRESCRIPTION_MAX_UPLOAD_BYTES:-10485760}
      GOOGLE_CLIENT_ID: ${GOOGLE_CLIENT_ID:-}
      GOOGLE_CLIENT_SECRET: ${GOOGLE_CLIENT_SECRET:-}
      DARMALTON_API_HOST: ${DARMALTON_API_HOST:?DARMALTON_API_HOST is required}
    volumes:
      - public_media:/app/media
      - private_media:/app/private_media
    depends_on:
      db:
        condition: service_healthy
    healthcheck:
      test:
        - CMD
        - python
        - -c
        - "import os, urllib.request; request=urllib.request.Request('http://localhost:8000/api/v1/health/', headers={'Host':os.environ['DARMALTON_API_HOST'],'X-Forwarded-Proto':'https'}); urllib.request.urlopen(request, timeout=3)"
      interval: 15s
      timeout: 5s
      retries: 12
    restart: unless-stopped
    networks: [edge, data]
    security_opt: ["no-new-privileges:true"]
    labels:
      traefik.enable: "true"
      traefik.http.routers.darmalton-api.rule: "Host(`${DARMALTON_API_HOST:?DARMALTON_API_HOST is required}`)"
      traefik.http.routers.darmalton-api.entrypoints: websecure
      traefik.http.routers.darmalton-api.tls: "true"
      traefik.http.routers.darmalton-api.tls.certresolver: ${TRAEFIK_CERT_RESOLVER:-letsencrypt}
      traefik.http.services.darmalton-api.loadbalancer.server.port: "8000"
      traefik.docker.network: darmalton_edge

  website:
    image: ${DARMALTON_WEBSITE_IMAGE:-darmalton-website-production:local}
    build:
      context: ./website
      dockerfile: ../infrastructure/website.Dockerfile
    environment:
      API_INTERNAL_URL: http://backend:8000/api/v1
      API_INTERNAL_FORWARDED_PROTO: https
      GOOGLE_CLIENT_ID: ${GOOGLE_CLIENT_ID:-}
      DJANGO_ADMIN_ORIGIN: https://${DARMALTON_API_HOST:?DARMALTON_API_HOST is required}
      DJANGO_ADMIN_PORT: "443"
    depends_on:
      backend:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://localhost:3000').then(r=>{if(!r.ok)process.exit(1)})"]
      interval: 15s
      timeout: 5s
      retries: 12
    restart: unless-stopped
    networks: [edge]
    security_opt: ["no-new-privileges:true"]
    labels:
      traefik.enable: "true"
      traefik.http.routers.darmalton-web.rule: "Host(`${DARMALTON_WEB_HOST:?DARMALTON_WEB_HOST is required}`)"
      traefik.http.routers.darmalton-web.entrypoints: websecure
      traefik.http.routers.darmalton-web.tls: "true"
      traefik.http.routers.darmalton-web.tls.certresolver: ${TRAEFIK_CERT_RESOLVER:-letsencrypt}
      traefik.http.routers.darmalton-www.rule: "Host(`www.${DARMALTON_WEB_HOST:?DARMALTON_WEB_HOST is required}`)"
      traefik.http.routers.darmalton-www.entrypoints: websecure
      traefik.http.routers.darmalton-www.tls: "true"
      traefik.http.routers.darmalton-www.tls.certresolver: ${TRAEFIK_CERT_RESOLVER:-letsencrypt}
      traefik.http.routers.darmalton-www.middlewares: darmalton-www-redirect
      traefik.http.routers.darmalton-www.service: darmalton-web
      traefik.http.middlewares.darmalton-www-redirect.redirectregex.regex: "^https?://www\\.${DARMALTON_WEB_HOST:?DARMALTON_WEB_HOST is required}(.*)"
      traefik.http.middlewares.darmalton-www-redirect.redirectregex.replacement: "https://${DARMALTON_WEB_HOST:?DARMALTON_WEB_HOST is required}$${1}"
      traefik.http.middlewares.darmalton-www-redirect.redirectregex.permanent: "true"
      traefik.http.services.darmalton-web.loadbalancer.server.port: "3000"
      traefik.docker.network: darmalton_edge

volumes:
  postgres_data:
  public_media:
  private_media:

networks:
  edge:
    name: darmalton_edge
  data:
    internal: true
