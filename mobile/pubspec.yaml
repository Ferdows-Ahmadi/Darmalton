name: darmalton_pharmacy
description: Milestone 1 Flutter client for the Darmalton online pharmacy.
publish_to: "none"
version: 1.0.0+1

environment:
  sdk: ">=3.10.0 <4.0.0"

dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter
  flutter_riverpod: 3.3.2
  dio: 5.10.0
  go_router: 17.3.0
  flutter_secure_storage: 10.3.1
  cached_network_image: 3.4.1
  google_sign_in: 7.2.0
  file_picker: 10.3.10
  geolocator: 14.0.2
  image_picker: 1.2.1
  flutter_image_compress: 2.4.0
  flutter_map: 8.2.2
  latlong2: 0.9.1

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: 6.0.0
  flutter_launcher_icons: 0.14.4

flutter:
  uses-material-design: true
  assets:
    - assets/branding/darmalton-wordmark.png
    - assets/branding/google-g.png
    - assets/branding/landing-hero.png
  fonts:
    - family: Vazirmatn
      fonts:
        - asset: assets/fonts/Vazirmatn-Regular.ttf
          weight: 400
        - asset: assets/fonts/Vazirmatn-Medium.ttf
          weight: 500
        - asset: assets/fonts/Vazirmatn-Bold.ttf
          weight: 700

flutter_launcher_icons:
  android: true
  ios: true
  remove_alpha_ios: true
  image_path: assets/branding/darmalton-launcher.png
  adaptive_icon_background: "#FFFFFF"
  adaptive_icon_foreground: assets/branding/darmalton-launcher-foreground.png
  adaptive_icon_foreground_inset: 18
  min_sdk_android: 24
