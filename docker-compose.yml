services:
  db:
    image: postgres:17.6-alpine
    environment:
      POSTGRES_DB: ${POSTGRES_DB}
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
    volumes:
      - pharmacy_postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $$POSTGRES_USER -d $$POSTGRES_DB"]
      interval: 5s
      timeout: 5s
      retries: 12
    restart: unless-stopped

  backend:
    build:
      context: ./backend
      dockerfile: ../infrastructure/backend.Dockerfile
    env_file: .env
    environment:
      DATABASE_URL: postgresql://${POSTGRES_USER}:${POSTGRES_PASSWORD}@db:5432/${POSTGRES_DB}
      DJANGO_USE_SQLITE: "false"
    volumes:
      - ./backend:/app
      - pharmacy_media:/app/media
    ports:
      - "8000:8000"
    depends_on:
      db:
        condition: service_healthy
    command:
      - sh
      - -c
      - >
        python manage.py migrate &&
        python manage.py seed_demo &&
        python manage.py collectstatic --noinput &&
        gunicorn pharmacy.wsgi:application --bind 0.0.0.0:8000 --workers 2 --reload
    healthcheck:
      test:
        - CMD
        - python
        - -c
        - "import urllib.request; urllib.request.urlopen('http://localhost:8000/api/schema/', timeout=3)"
      interval: 10s
      timeout: 5s
      retries: 12
    restart: unless-stopped

  website:
    build:
      context: ./website
      dockerfile: ../infrastructure/website.Dockerfile
    environment:
      API_INTERNAL_URL: http://backend:8000/api/v1
      NEXT_PUBLIC_API_BASE_URL: http://localhost:8000/api/v1
      DJANGO_ADMIN_ORIGIN: ${DJANGO_ADMIN_ORIGIN:-}
      DJANGO_ADMIN_PORT: ${DJANGO_ADMIN_PORT:-8000}
      GOOGLE_CLIENT_ID: ${GOOGLE_CLIENT_ID:-}
    ports:
      - "3000:3000"
    depends_on:
      backend:
        condition: service_healthy
    healthcheck:
      test:
        - CMD
        - node
        - -e
        - "fetch('http://localhost:3000').then(r=>{if(!r.ok)process.exit(1)})"
      interval: 10s
      timeout: 5s
      retries: 12
    restart: unless-stopped

  dev-discovery:
    profiles: ["dev"]
    build:
      context: ./backend
      dockerfile: ../infrastructure/backend.Dockerfile
    environment:
      DARMALTON_DEV_API_HOST: ${DARMALTON_DEV_API_HOST:-}
    command: ["python", "-m", "pharmacy.dev_discovery"]
    ports:
      - "53535:53535/udp"
    depends_on:
      backend:
        condition: service_healthy
    restart: unless-stopped

volumes:
  pharmacy_postgres_data:
  pharmacy_media:
